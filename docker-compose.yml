services:
  threatlens:
    build: .
    image: threatlens-ai:offline
    ports:
      - "4173:4173"
    environment:
      PORT: "4173"
      ENABLE_GENERATIVE_REPORTS: "false"
      ENABLE_REMOTE_VALIDATION: "false"
      ENABLE_VISION_FALLBACK: "false"
      FLOW_STRATEGY: "legacy"
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
